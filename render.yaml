services:
  - type: web
    name: bandproject-music-processor
    runtime: docker
    plan: free
    rootDir: services/music-processor
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: WEB_ORIGINS
        value: https://jasonyou654-maker.github.io
      - key: ENABLE_SOURCE_SEPARATION
        value: "true"
      - key: DEMUCS_MODEL
        value: htdemucs_ft
      - key: SEPARATION_ENGINE
        value: slakh
      - key: TRANSCRIPTION_ENGINE
        value: fast-spectral
      - key: MULTISTEM_CHUNK_SECONDS
        value: "8"
