name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_SITE: "true"
          NEXT_PUBLIC_MUSIC_PROCESSOR_URL: ${{ vars.MUSIC_PROCESSOR_URL }}
      - run: sh ./scripts/render-pages.sh
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_SITE: "true"
          NEXT_PUBLIC_MUSIC_PROCESSOR_URL: ${{ vars.MUSIC_PROCESSOR_URL }}
      - run: touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
